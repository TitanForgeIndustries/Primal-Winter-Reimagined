name: Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Get the version
        id: get_version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            return '${{ github.ref }}'.replace('refs/tags/v', '');
      - name: Build
        run: ./gradlew build
        env:
          VERSION: ${{ steps.get_version.outputs.result }}
      - name: Create draft release and upload Forge jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.result }}
        run: |
          gh release create "v${VERSION}" \
            "./Forge/build/libs/primalwinter-forge-1.20.1-${VERSION}.jar" \
            --draft \
            --title "Primal Winter 1.20.1-${VERSION}" \
            --notes "This was an automatic Forge build."
